apiVersion: apps/v1
kind: Deployment
metadata:
  name: safarni-frontend
  namespace: safarni
  labels:
    app.kubernetes.io/name: safarni-frontend
    app.kubernetes.io/part-of: safarni
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safarni-frontend
  template:
    metadata:
      labels:
        app: safarni-frontend
        app.kubernetes.io/name: safarni-frontend
        app.kubernetes.io/part-of: safarni
    spec:
      containers:
        - name: frontend
          image: safarni-frontend:evidence
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
