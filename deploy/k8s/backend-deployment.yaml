apiVersion: apps/v1
kind: Deployment
metadata:
  name: safarni-backend
  namespace: safarni
  labels:
    app.kubernetes.io/name: safarni-backend
    app.kubernetes.io/part-of: safarni
spec:
  replicas: 1
  selector:
    matchLabels:
      app: safarni-backend
  template:
    metadata:
      labels:
        app: safarni-backend
        app.kubernetes.io/name: safarni-backend
        app.kubernetes.io/part-of: safarni
    spec:
      containers:
        - name: backend
          image: safarni-backend:evidence
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: safarni-backend-config
            - secretRef:
                name: safarni-backend-secrets
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: {}
