apiVersion: v1
kind: ConfigMap
metadata:
  name: safarni-backend-config
  namespace: safarni
  labels:
    app.kubernetes.io/name: safarni-backend
    app.kubernetes.io/part-of: safarni
data:
  PORT: "5000"
  NODE_ENV: "production"
  FRONTEND_URL: "http://localhost:3000"
  ACCESS_TOKEN_EXPIRES_DEVELOPMENT: "1d"
  ACCESS_TOKEN_EXPIRES: "1h"
  REFRESH_TOKEN_EXPIRES: "7d"
  OPENAI_SEARCH_MODEL: "gpt-5-mini"
  FLIGHT_SEARCH_REGION: "EG"
